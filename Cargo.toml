[package]
name = "msi-rgb"
version = "0.2.1"
edition = "2024"
description = "Native Linux RGB keyboard controller for MSI Katana 15 HX laptops"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeremylanes/msi-rgb"
readme = "README.md"
keywords = ["msi", "rgb", "keyboard", "katana", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
byteorder = "1.5.0"
clap = { version = "4.6.6", features = ["derive"] }
gtk4 = "0.11.4"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
